version: '3.8'

services:
  db:
    image: postgres:15
    container_name: dataturf_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dataturf
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dataturf-backend:latest
    container_name: dataturf_backend
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=dataturf
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dataturf-frontend:latest
    container_name: dataturf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  data-ingestion:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dataturf-data-ingestion:latest
    container_name: dataturf_data_ingestion
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=dataturf
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: dataturf_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
